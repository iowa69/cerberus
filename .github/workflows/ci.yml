name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  smoke:
    # End-to-end run against miniature synthetic references, so the pipeline
    # itself is exercised without the ~23 GB Zenodo bundle.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          activate-environment: cerberus-ci
      - name: Install toolchain
        run: |
          conda install -y -c conda-forge -c bioconda \
            python=3.11 fastp minimap2 bowtie2 bbmap kraken2 samtools pigz
          pip install -e ".[dev]"
      - name: Build fixture and run end-to-end
        run: bash scripts/smoke_test.sh
