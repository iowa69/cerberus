{% set name = "cerberus-mg" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/iowa69/cerberus/archive/v{{ version }}.tar.gz
  sha256: PLACEHOLDER_FILLED_AT_RELEASE

build:
  number: 0
  noarch: python
  entry_points:
    - cerberus = cerberus.cli:main
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - tqdm >=4.66
    - pyyaml >=6.0
    - fastp >=0.24
    - minimap2 >=2.28
    - bowtie2 >=2.5
    - bbmap >=39.0
    - kraken2 >=2.1.3
    - samtools >=1.20
    - seqkit >=2.8
    - pigz
    - aria2
    - multiqc >=1.25
    - chopper >=0.9
    - winnowmap >=2.03
    - bedtools >=2.31
    - zstd >=1.5

test:
  imports:
    - cerberus
  commands:
    - cerberus --version
    - cerberus --help

about:
  home: https://github.com/iowa69/cerberus
  license: MIT
  license_file: LICENSE
  summary: "Three-headed host-removal pipeline for metagenomics: assembly, profiling, and GDPR-compliant outputs from one run."
  doc_url: https://github.com/iowa69/cerberus
  dev_url: https://github.com/iowa69/cerberus

extra:
  recipe-maintainers:
    - iowa69
