name: cerberus
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10
  - pip
  - tqdm>=4.66
  # invoked directly by the pipeline
  - fastp>=0.24
  - fastplong>=0.2
  - minimap2>=2.28
  - bowtie2>=2.5
  - bbmap>=39.0
  - kraken2>=2.1.3
  - samtools>=1.20
  # required to unpack the published .tar.zst reference archives
  - zstd>=1.5
  # optional accelerators; each has a fallback path in code
  - pigz
  - aria2
  - winnowmap>=2.03
  # only needed by scripts/build_refs/*, not by the pipeline itself
  - bedtools>=2.31
  - curl
  - tar
  - pip:
      - -e .
